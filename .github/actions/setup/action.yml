name: Setup Repository
description: |
  Initialize the repository environment for CI workflows.

  Performs:
  - Node.js setup for the specified version
  - pnpm cache restoration
  - Corepack enablement for pnpm
  - Dependency installation with frozen lockfile

inputs:
  node-version:
    description: Node.js version to use
    required: true
    type: string

runs:
  using: composite

  steps:
    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Enable Corepack
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@$(node -e "console.log(require('./package.json').packageManager.split('@').pop())") --activate

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
