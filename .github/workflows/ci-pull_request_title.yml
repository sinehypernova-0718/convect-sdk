name: "PR Title Check"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR Title Format
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title Syntax
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "=================================================="
          echo "🔍 Checking PR Title: \"$PR_TITLE\""
          echo "=================================================="

          TYPES="feat|fix|perf|test|docs|refactor|build|ci|chore"
          SCOPES="core|protocol|sdk|transports|cli|examples|docs|ci|build"

          # Enforces:
          # 1. Valid type & optional scope
          # 2. Capitalized description start
          # 3. NO trailing period (.), exclamation (!), question mark (?), or space
          TITLE_REGEX="^(${TYPES})(\(${SCOPES}\))?!: [A-Z](.*[^.!? ])?$"

          if [[ ! "$PR_TITLE" =~ $TITLE_REGEX ]]; then
            echo ""
            echo "❌ ERROR: PR Title does not follow Conventional Commits guidelines!"
            echo "------------------------------------------------------------------"
            echo ""
            echo "🛠️  HOW TO FIX THIS:"
            echo "1. Go to the top of this Pull Request page."
            echo "2. Click 'Edit' next to the PR title."
            echo "3. Rename your title using the structure below."
            echo ""
            echo "📌 EXPECTED FORMAT:"
            echo "   <type>(<scope>): <Capitalized summary without trailing punctuation>"
            echo ""
            echo "📋 ALLOWED TYPES:"
            echo "   • feat      : A new feature"
            echo "   • fix       : A bug fix"
            echo "   • perf      : Performance improvements"
            echo "   • test      : Tests only"
            echo "   • docs      : Documentation changes"
            echo "   • refactor  : Code refactoring"
            echo "   • build     : Build system / dependencies"
            echo "   • ci        : CI configuration"
            echo "   • chore     : Maintenance tasks"
            echo ""
            echo "🎯 ALLOWED SCOPES (Optional):"
            echo "   • core | protocol | sdk | transports | cli | examples | docs | ci | build"
            echo ""
            echo "⚠️  SUMMARY RULES:"
            echo "   • MUST start with a Capital letter."
            echo "   • MUST have a space after the colon ':'."
            echo "   • MUST NOT end with a period '.', '!', '?', or trailing space."
            echo ""
            echo "💡 VALID EXAMPLES:"
            echo "   ✅ fix(core): Enhance PR title validation with detailed error messages"
            echo "   ✅ feat(protocol): Add device registration messages"
            echo "   ✅ docs: Improve installation guide"
            echo ""
            echo "⛔ INVALID EXAMPLES:"
            echo "   ❌ fix(core): Enhance PR title validation. (ends with a period)"
            echo "   ❌ fix(core): enhance PR title validation (lowercase start)"
            echo ""
            echo "------------------------------------------------------------------"
            exit 1
          fi

          echo ""
          echo "✅ Success! PR title complies with Conventional Commits rules."
