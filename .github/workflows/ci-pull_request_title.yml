name: "PR Title Check"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR Title Format
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title Syntax
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "=================================================="
          echo "🔍 Checking PR Title: \"$PR_TITLE\""
          echo "=================================================="

          # Define allowed types and scopes
          TYPES="feat|fix|perf|test|docs|refactor|build|ci|chore"
          SCOPES="core|protocol|sdk|transports|cli|examples|docs|ci|build"

          # POSIX Extended Regex compatible with Bash [[ ... =~ ... ]]
          TITLE_REGEX="^(${TYPES})(\(${SCOPES}\))?!:\s[A-Z].+$"

          if [[ ! "$PR_TITLE" =~ $TITLE_REGEX ]]; then
            echo ""
            echo "❌ ERROR: PR Title does not follow Conventional Commits guidelines!"
            echo "------------------------------------------------------------------"
            echo ""
            echo "🛠️  HOW TO FIX THIS:"
            echo "1. Go to the top of this Pull Request page."
            echo "2. Click 'Edit' next to the PR title."
            echo "3. Rename your title using the structure below."
            echo ""
            echo "📌 EXPECTED FORMAT:"
            echo "   <type>(<scope>): <Capitalized description>"
            echo "   <type>!: <Capitalized description for breaking changes>"
            echo ""
            echo "📋 ALLOWED TYPES:"
            echo "   • feat      : A new feature"
            echo "   • fix       : A bug fix"
            echo "   • perf      : A code change that improves performance"
            echo "   • test      : Adding or updating tests"
            echo "   • docs      : Documentation changes only"
            echo "   • refactor  : Code changes that neither fix bugs nor add features"
            echo "   • build     : Changes affecting the build system or dependencies"
            echo "   • ci        : Changes to CI configuration scripts"
            echo "   • chore     : Other changes that don't modify src or test files"
            echo ""
            echo "🎯 ALLOWED SCOPES (Optional):"
            echo "   • core | protocol | sdk | transports | cli | examples | docs | ci | build"
            echo ""
            echo "⚠️  DESCRIPTION RULES:"
            echo "   • MUST start with a Capital letter (e.g., 'Add', 'Fix', 'Update')."
            echo "   • MUST have a space after the colon ':'."
            echo ""
            echo "💡 VALID EXAMPLES:"
            echo "   ✅ feat(protocol): Add device registration messages"
            echo "   ✅ fix(core): Handle reconnect failures"
            echo "   ✅ fix(cli)!: Drop legacy flag support"
            echo "   ✅ docs: Improve installation guide"
            echo ""
            echo "------------------------------------------------------------------"
            exit 1
          fi

          echo ""
          echo "✅ Success! PR title complies with Conventional Commits rules."

