name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 23, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup repository
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Build
        run: pnpm build
