name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Lint runs on a single Node version (24) only.
    # Biome diagnostics are independent of the runtime and produce
    # identical results across Node versions. Linting only on the LTS
    # version reduces CI time without sacrificing validation confidence.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup repository
        uses: ./.github/actions/setup
        with:
          node-version: 24

      - name: Lint
        run: pnpm lint
