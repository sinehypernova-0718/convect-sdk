packages:
  - "packages/*"
  - "packages/transports/*"
  - "apps/*"
  - "examples/*"

allowBuilds:
  esbuild: true

# Dependency resolution
preferWorkspacePackages: true
 
# Hoisting strategy for optimal node_modules structure
shamefullyHoist: false
 
# Link workspace packages
linkWorkspacePackages: true
 
# Install strategy
autoInstallPeers: true
 
# Override settings per package can be done via .npmrc in package directory

onlyBuiltDependencies:
  - esbuild
